[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-risk-engine"
version = "0.1.0"
description = "Portfolio stress testing and quantitative risk engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tomer C." }]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "yfinance>=0.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
qre = "qre.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qre"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qre",
    "configs",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["qre"]